<!DOCTYPE html>
<html>

<head>
    <title>Registration Form</title>
</head>

<body>

    <h1>Student Registration</h1>

    <form>

        <label>Name:</label>
        <input type="text">

        <br><br>

        <label>Email:</label>
        <input type="email">

        <br><br>

        <label>Password:</label>
        <input type="password">

        <br><br>

        <label>Age:</label>
        <input type="number">

        <br><br>

        <label>Date of Birth:</label>
        <input type="date">

        <br><br>

        <label>City:</label>

        <select>
            <option>Mumbai</option>
            <option>Pune</option>
            <option>Delhi</option>
            <option>Bangalore</option>
        </select>

        <br><br>

        <label>Message:</label>

        <br>

        <textarea rows="5" cols="30"></textarea>

        <br><br>

        <label>Upload Photo:</label>
        <input type="file">

        <br><br>

        <button>Submit</button>

    </form>

</body>

</html>
