<!DOCTYPE html>
<html>

<head>
    <title>Student Registration</title>
</head>

<body>

    <h1>Student Registration Form</h1>

    <form>

        <label>Name:</label>
        <input type="text">

        <br><br>

        <label>Email:</label>
        <input type="email">

        <br><br>

        <label>Password:</label>
        <input type="password">

        <br><br>

        <p>Gender:</p>

        <input type="radio" name="gender">
        <label>Male</label>

        <input type="radio" name="gender">
        <label>Female</label>

        <p>Hobbies:</p>

        <input type="checkbox">
        <label>Gaming</label>

        <input type="checkbox">
        <label>Travelling</label>

        <input type="checkbox">
        <label>Music</label>

        <br><br>

        <button>Submit</button>

    </form>

</body>

</html>
